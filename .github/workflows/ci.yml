# CI for the Luxbit fork of rust-sbert — dual backend (torch | onnx).
#
# Design notes:
#
# * Backends are mutually exclusive cargo features (compile_error! guards in
#   src/lib.rs): `torch` (default) and `onnx`. Every onnx-leg command must
#   therefore pass `--no-default-features --features onnx`; every torch-leg
#   command uses the default feature set.
#
# * torch leg: the `torch` feature enables rust-bert's `libtorch`, whose tch
#   dependency carries `download-libtorch` — torch-sys fetches PyTorch 2.4
#   itself (CPU build on Linux, matching wheel on Apple Silicon runners)
#   when no LIBTORCH* env vars are set. check/doc/unit jobs are otherwise
#   hermetic.
#
# * onnx leg: libtorch-free (rust-bert from the Luxbit fork with
#   `features = ["onnx"]`, tch optional there). ort uses the "manual setup"
#   from the fork README: explicit `ort = "=2.0.0-rc.13"` with
#   `load-dynamic`, so onnxruntime is located at RUNTIME via ORT_DYLIB_PATH
#   and never linked/downloaded during builds — check/unit jobs need
#   nothing at all; the integration job downloads an onnxruntime release.
#
# * Integration jobs prepare the distiluse checkpoint per backend via
#   utils/prepare_models.py (`--backend torch`: safetensors -> .ot through
#   the convert-tensor bin; `--backend onnx`: optimum bare-backbone export —
#   the pip torch wheel is Python-only, the Rust build stays libtorch-free).

name: CI

on:
  push:
    branches: [master, "feat/**", "spike/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  check:
    name: check (${{ matrix.os }}, ${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        backend: [torch, onnx]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check
        run: cargo check --all-targets ${{ matrix.backend == 'onnx' && '--no-default-features --features onnx' || '' }}
      - name: cargo doc (warnings are errors)
        if: matrix.os == 'ubuntu-latest' && matrix.backend == 'torch'
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  unit-tests:
    name: unit-tests (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        backend: [torch, onnx]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib ${{ matrix.backend == 'onnx' && '--no-default-features --features onnx' || '' }}

  integration-torch:
    # Model-backed sbert_test target against the real distiluse checkpoint
    # (VarStore .ot weights), default (torch) features.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install python deps
        run: python -m pip install -r utils/requirements-torch.txt
      - name: Cache distiluse checkpoint
        uses: actions/cache@v4
        with:
          path: models/
          key: distiluse-torch-${{ hashFiles('utils/prepare_models.py', 'utils/requirements-torch.txt') }}
      - name: Prepare checkpoint
        if: ${{ !hashFiles('models/distiluse-base-multilingual-cased/model.ot') }}
        run: python3 utils/prepare_models.py sentence-transformers/distiluse-base-multilingual-cased models/distiluse-base-multilingual-cased --backend torch
      - name: cargo test
        run: cargo test --test sbert_test

  integration-onnx:
    # Model-backed test_onnx target against the real distiluse checkpoint
    # (bare-backbone model.onnx + Dense safetensors), onnx features only —
    # no libtorch anywhere in this job's Rust build.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORT_DYLIB_PATH: /opt/onnxruntime/lib/libonnxruntime.so
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Manual onnxruntime setup
        run: |
          curl -sSL https://github.com/microsoft/onnxruntime/releases/download/v1.20.1/onnxruntime-linux-x64-1.20.1.tgz \
            | tar -xz -C /opt
          mv /opt/onnxruntime-linux-x64-1.20.1 /opt/onnxruntime
          ls -la /opt/onnxruntime/lib
      - name: Install python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r utils/requirements-onnx.txt
      - name: Cache distiluse checkpoint
        uses: actions/cache@v4
        with:
          path: models/
          key: distiluse-onnx-${{ hashFiles('utils/prepare_models.py', 'utils/prepare_onnx.py', 'utils/requirements-onnx.txt') }}
      - name: Prepare checkpoint
        if: ${{ !hashFiles('models/distiluse-base-multilingual-cased/model.onnx') }}
        run: python3 utils/prepare_models.py sentence-transformers/distiluse-base-multilingual-cased models/distiluse-base-multilingual-cased --backend onnx
      - name: cargo test
        run: cargo test --test test_onnx --no-default-features --features onnx
