[package]
name = "sbert"
version = "0.7.0"
authors = ["Chady Dimachkie <cpcdoy@gmail.com>"]
edition = "2018"
description = "Rust implementation of Sentence Bert (SBert)"
repository = "https://github.com/cpcdoy/rust-sbert"
keywords = ["nlp", "embedding", "bert", "sbert", "transformers"]
license = "Apache-2.0"
readme = "README.md"
include = ["src/", "Cargo.toml", "build.rs"]

[dependencies]
lazy_static = "1.4"
log = "0.4"
ndarray = { version = "0.15", optional = true }
num_cpus = "1.13"
ort = { version = "~1.15.2", optional = true, default-features = false, features = ["half", "load-dynamic", "cuda"] }
prost = "0.9"
rayon = "1.5"
rust-bert = { git = "https://github.com/guillaume-be/rust-bert", rev = "29f9a7a", default-features = false }
rust_tokenizers = "7.0"
serde = "1.0"
serde_json = "1.0"
strum = "0.23"
strum_macros = "0.23"
tch = "0.15.0"
thiserror = "1.0"
tokenizers = "0.15"
torch-sys = "0.15.0"

[dev-dependencies]
criterion = "0.3"
rand = "0.8"

[features]
doc-only = ["tch/doc-only"]
all-tests = []
onnx = ["rust-bert/onnx", "dep:ort", "dep:ndarray"]

[package.metadata.docs.rs]
features = ["doc-only"]

[lib]
name = "sbert"
path = "src/lib.rs"
crate-type = ["lib"]

# NOTE: ort 1.15.x is yanked on crates.io (the whole 1.x line — soundness
# yank, pykeio/ort#386). The version above cannot be freshly resolved; it is
# pinned by the COMMITTED Cargo.lock (registry source + checksum), which is
# why Cargo.lock is checked in despite this being a library.
#   - do NOT run a bare `cargo update` (re-resolution drops the pin and dies
#     on the yank); use targeted `cargo update -p <pkg> --precise` only.
#   - downstream users enabling the `onnx` feature must replicate the same
#     [[package]] pin in their own Cargo.lock (dependency lockfiles are
#     ignored by cargo).
#   - remove the pin when rust-bert moves to ort 2.x.

[[bin]]
name = "convert-tensor"
path = "src/bin/convert-tensor.rs"
doc = false

[[test]]
name = "sbert_test"
path = "tests/test_sbert.rs"
doc = false

[[test]]
name = "distilroberta_test"
path = "tests/test_distilroberta.rs"
doc = false

[[bench]]
name = "sbert_bench"
path = "benches/bench_sbert.rs"
harness = false
doc = false

[[bench]]
name = "distilroberta_bench"
path = "benches/bench_distilroberta.rs"
harness = false
doc = false

[[test]]
name = "test_onnx"
path = "tests/test_onnx.rs"
required-features = ["onnx"]
doc = false
